# 自动发布工作流 (多平台)
# 触发方式一: 推送 v* 标签 -> 三平台矩阵构建 Electron 安装包 + 后端 jar + 浏览器版 zip, 汇总创建 GitHub Release
# 触发方式二: Actions 页面手动运行(workflow_dispatch), 填入已有标签名, 可为历史标签补发 Release
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的标签 (如 v1.0.1)'
        required: true
        type: string

# 创建 Release 需要写内容权限
permissions:
  contents: write

jobs:
  # ---------- 后端 jar (单次) ----------
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: 安装 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 打包后端
        run: mvn -B clean package --file backend/pom.xml

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          if-no-files-found: error

  # ---------- 浏览器版 zip (单次) ----------
  web:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: 安装 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 构建前端
        working-directory: frontend
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          npm ci
          npm run build

      - name: 压缩浏览器版
        run: zip -qr frontend-dist-web.zip frontend/dist

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: web-zip
          path: frontend-dist-web.zip
          if-no-files-found: error

  # ---------- Electron 桌面安装包 (三平台矩阵) ----------
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platforms: win
          - os: macos-latest
            platforms: mac
          - os: ubuntu-latest
            platforms: linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: 安装 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 构建安装包
        working-directory: frontend
        env:
          # 无证书, 显式跳过 macOS 代码签名
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm ci
          npm run build
          npx electron-builder --${{ matrix.platforms }} --publish never

      - name: 诊断构建结果
        if: always()
        working-directory: frontend
        shell: bash
        run: |
          echo "--- release/ 目录内容:"
          ls -la release/ 2>/dev/null || echo 'release 目录不存在'
          echo "--- 全仓库安装包搜索:"
          find .. -maxdepth 4 \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \) 2>/dev/null || true
          echo "--- dist 是否存在:"
          ls dist/index.html 2>/dev/null || echo 'dist 不存在'

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platforms }}
          # 只上传安装包本体, 排除 *-unpacked 目录 / blockmap / 构建配置快照
          path: |
            frontend/release/*.exe
            frontend/release/*.dmg
            frontend/release/*.AppImage
            frontend/release/*.deb
          if-no-files-found: error

  # ---------- 汇总发布 ----------
  release:
    needs: [backend, web, desktop]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 查看产物
        run: ls -lh artifacts/

      - name: 创建 GitHub Release
        run: |
          FILES=()
          for f in artifacts/*.exe artifacts/*.dmg artifacts/*.AppImage artifacts/*.deb artifacts/*.zip artifacts/*.jar; do
            [ -e "$f" ] && FILES+=("$f")
          done
          if [ ${#FILES[@]} -eq 0 ]; then
            echo '::error::没有任何产物可发布'
            exit 1
          fi
          gh release create "$TAG" "${FILES[@]}" \
            --title "$TAG" \
            --generate-notes
