server:
  port: 8080

spring:
  application:
    name: qbank
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 连接信息可通过环境变量覆盖(生产环境务必通过环境变量注入, 勿提交真实口令):
    #   DB_URL / DB_USERNAME / DB_PASSWORD
    url: ${DB_URL:jdbc:mysql://localhost:3306/question_bank?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:qbank}
    password: ${DB_PASSWORD:qbank123}
  servlet:
    multipart:
      max-file-size: 10MB

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.qbank.entity
  configuration:
    map-underscore-to-camel-case: true
    use-generated-keys: true

pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true

# JWT 签名密钥(生产环境务必通过环境变量 QBANK_JWT_SECRET 覆盖为高强度随机串)
qbank:
  jwt:
    secret: ${QBANK_JWT_SECRET:dev-only-change-me-in-production-0123456789abcdef}
  # CORS 允许来源(逗号分隔); 默认 * 兼容 Electron file:// 与本地开发, 公网部署请收紧
  cors:
    allowed-origins: ${QBANK_CORS_ALLOWED_ORIGINS:*}

# 需要排查 SQL 时再临时开启, 勿在生产常开(会打印全部 SQL 与参数)
#logging:
#  level:
#    com.qbank.mapper: debug

# v2 起 AI 分析在前端本地完成(浏览器直连大模型), 后端不再提供 AI 接口
# 前端配置入口: 系统界面左侧菜单 -> AI 设置
