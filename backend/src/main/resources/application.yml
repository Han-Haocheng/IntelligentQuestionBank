server:
  port: 8080

spring:
  application:
    name: qbank
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/question_bank?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: qbank
    password: "qbank123"
  servlet:
    multipart:
      max-file-size: 10MB

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.qbank.entity
  configuration:
    map-underscore-to-camel-case: true
    use-generated-keys: true

pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true

logging:
  level:
    com.qbank.mapper: debug

# v2 起 AI 分析在前端本地完成(浏览器直连大模型), 后端不再提供 AI 接口
# 前端配置入口: 系统界面左侧菜单 -> AI 设置
