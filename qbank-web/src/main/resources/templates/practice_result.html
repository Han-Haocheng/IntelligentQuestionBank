<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: css('练习成绩')}"></head>
<body>
<div class="qk-layout">
    <aside th:replace="~{fragments/layout :: sidebar('records')}"></aside>
    <div class="qk-main">
        <div th:replace="~{fragments/layout :: topbar}"></div>
        <main class="qk-content">
            <div th:replace="~{fragments/layout :: flash}"></div>

            <!-- 成绩摘要 -->
            <div class="card mb-3">
                <div class="card-body">
                    <div class="d-flex align-items-center justify-content-between flex-wrap gap-2">
                        <h5 class="card-title mb-0">
                            <span th:if="${fromDetail}"><i class="bi bi-file-earmark-text text-primary"></i></span>
                            <span th:unless="${fromDetail}"><i class="bi bi-trophy text-primary"></i></span>
                            <span th:text="${record.name}">练习名称</span>
                            <span class="badge text-bg-info ms-1" th:text="${modeName}">模式</span>
                            <span class="badge text-bg-success ms-1" th:if="${record.status == 1}">已完成</span>
                            <span class="badge text-bg-secondary ms-1" th:if="${record.status == 0}">进行中</span>
                        </h5>
                        <div>
                            <a th:if="${fromDetail}" th:href="@{/practice/records}" class="btn btn-outline-secondary btn-sm">
                                <i class="bi bi-arrow-left"></i> 返回记录列表
                            </a>
                            <a th:unless="${fromDetail}" th:href="@{/practice}" class="btn btn-outline-primary btn-sm">
                                <i class="bi bi-plus-circle"></i> 再练一次
                            </a>
                            <a th:unless="${fromDetail}" th:href="@{/practice/records}" class="btn btn-outline-secondary btn-sm">
                                <i class="bi bi-clock-history"></i> 练习记录
                            </a>
                        </div>
                    </div>
                    <div class="row text-center mt-4 g-2" th:if="${record.status == 1}">
                        <div class="col-6 col-md-2">
                            <div class="text-muted small">总题数</div>
                            <div class="fs-4 fw-bold" th:text="${record.total ?: 0}">0</div>
                        </div>
                        <div class="col-6 col-md-2">
                            <div class="text-muted small">正确数</div>
                            <div class="fs-4 fw-bold text-success" th:text="${record.correct ?: 0}">0</div>
                        </div>
                        <div class="col-6 col-md-2">
                            <div class="text-muted small">正确率</div>
                            <div class="fs-4 fw-bold text-primary">
                                <span th:text="${#numbers.formatDecimal(accuracy, 0, 1)}">0</span>%
                            </div>
                        </div>
                        <div class="col-6 col-md-3">
                            <div class="text-muted small">用时</div>
                            <div class="fs-6 fw-bold"
                                 th:text="${record.duration != null ? (record.duration / 60) + '分' + (record.duration % 60) + '秒' : '-'}">0</div>
                        </div>
                        <div class="col-6 col-md-3">
                            <div class="text-muted small">完成时间</div>
                            <div class="fs-6">
                                <span th:if="${record.finishTime != null}"
                                      th:text="${#temporals.format(record.finishTime, 'yyyy-MM-dd HH:mm')}">时间</span>
                                <span th:if="${record.finishTime == null}">-</span>
                            </div>
                        </div>
                    </div>
                    <div class="mt-3" th:if="${record.status == 0}">
                        <div class="alert alert-warning mb-0 py-2 small">
                            <i class="bi bi-exclamation-triangle"></i>
                            该练习尚未交卷。若正在答题, 请返回答题页继续; 会话失效后需重新开始练习。
                        </div>
                    </div>
                    <div class="alert alert-info mt-3 mb-0 py-2 small" th:if="${record.status == 1 && unanswered > 0}">
                        <i class="bi bi-info-circle"></i> 本次共 <strong th:text="${unanswered}">0</strong> 题未作答, 未作答题目不计分且不出现在下方明细中。
                    </div>
                </div>
            </div>

            <!-- 逐题对错/答案/解析 -->
            <div class="d-flex align-items-center gap-3 mb-2" th:if="${record.status == 1}">
                <h6 class="mb-0"><i class="bi bi-list-check"></i> 题目明细</h6>
                <span class="text-success small">正确 <strong th:text="${record.correct ?: 0}">0</strong></span>
                <span class="text-danger small">错误 <strong th:text="${answered - (record.correct ?: 0)}">0</strong></span>
                <span class="text-muted small">未答 <strong th:text="${unanswered}">0</strong></span>
            </div>

            <div th:if="${answers.isEmpty()}" class="card">
                <div class="card-body text-center text-muted py-4">
                    暂无答题明细(所有题目均未作答)。
                </div>
            </div>

            <div class="card mb-3" th:each="a, st : ${answers}">
                <div class="card-header bg-white py-2 d-flex align-items-center justify-content-between flex-wrap gap-2">
                    <div>
                        <span class="badge text-bg-secondary me-1"
                              th:text="${typeNameMap[a.type] ?: '题目'}">题型</span>
                        <span class="badge text-bg-light border"
                              th:if="${a.difficulty != null and difficultyNameMap[a.difficulty] != null}"
                              th:text="${'难度: ' + (difficultyNameMap[a.difficulty] ?: '')}">难度</span>
                    </div>
                    <div>
                        <span class="badge text-bg-success" th:if="${a.isCorrect == 1}">
                            <i class="bi bi-check-circle"></i> 回答正确
                        </span>
                        <span class="badge text-bg-danger" th:if="${a.isCorrect == 0}">
                            <i class="bi bi-x-circle"></i> 回答错误
                        </span>
                    </div>
                </div>
                <div class="card-body">
                    <p class="mb-3" style="white-space: pre-wrap;" th:text="${a.title}">题干</p>
                    <div class="border rounded p-3 bg-light">
                        <div class="mb-1">
                            <span class="text-muted">你的答案:</span>
                            <span th:text="${a.userAnswer != null and a.userAnswer != '' ? a.userAnswer : '(未作答)'}"
                                  th:classappend="${a.isCorrect == 1} ? ' fw-semibold text-success' : ' fw-semibold text-danger'">答案</span>
                        </div>
                        <div class="mb-1">
                            <span class="text-muted">正确答案:</span>
                            <span class="fw-semibold text-success" th:text="${a.correctAnswer ?: '-'}">答案</span>
                        </div>
                        <div th:if="${a.analysis != null and a.analysis != ''}">
                            <span class="text-muted">解析:</span>
                            <span style="white-space: pre-wrap;" th:text="${a.analysis}">解析</span>
                        </div>
                        <div th:if="${a.analysis == null or a.analysis == ''}" class="text-muted">本题暂无解析</div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
