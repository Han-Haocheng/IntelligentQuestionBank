<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: css('出错了')}"></head>
<body>
<div class="auth-page">
    <div class="auth-card card shadow">
        <div class="card-body p-4 text-center">
            <div class="display-6 mb-3">
                <span th:if="${status == 500}" class="text-danger"><i class="bi bi-x-octagon"></i></span>
                <span th:if="${status != 500}" class="text-warning"><i class="bi bi-exclamation-triangle"></i></span>
            </div>
            <h5 th:if="${status}" class="text-muted" th:text="'HTTP ' + ${status}">状态</h5>
            <p class="text-muted" th:text="${message ?: '页面不存在或已被移除'}">出错了</p>
            <a th:href="@{/dashboard}" class="btn btn-primary">返回工作台</a>
        </div>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
